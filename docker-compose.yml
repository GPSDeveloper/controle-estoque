services:
  postgres:
    image: postgres:16-alpine
    container_name: controle-estoque-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-controle_estoque}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-controle_estoque}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.migrate
    container_name: controle-estoque-migrate
    entrypoint: ["sh", "/migrate-entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CONNECTION_STRING: Host=postgres;Port=5432;Database=${POSTGRES_DB:-controle_estoque};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
    restart: "no"

volumes:
  postgres_data:
